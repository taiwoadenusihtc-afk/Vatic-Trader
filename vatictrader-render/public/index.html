/* =============================== EVENT BINDING ================================== */
let pendingBrokerMode = 'demo';

function bindEvents() {
  const root = document.getElementById('app');

  // Forms
  const loginForm = root.querySelector('form[data-form="login"]');
  if (loginForm) loginForm.addEventListener('submit', e => { e.preventDefault(); const f = new FormData(loginForm); handleLogin(f.get('username'), f.get('password')); });

  const signupForm = root.querySelector('form[data-form="signup"]');
  if (signupForm) signupForm.addEventListener('submit', e => { e.preventDefault(); const f = new FormData(signupForm); handleSignup(f.get('name'), f.get('email'), f.get('username'), f.get('password')); });

  const brokerForm = root.querySelector('form[data-form="connect-broker"]');
  if (brokerForm) brokerForm.addEventListener('submit', e => {
    e.preventDefault();
    const id = brokerForm.getAttribute('data-id');
    const f = new FormData(brokerForm);
    const b = brokerById(id);
    const last = (f.get('apiKey') || '').slice(-4).padStart(4, 'X');
    State.user.brokers[id] = { connected: true, accountLabel: `${b.name} •• ${pendingBrokerMode === 'live' ? 'Live' : 'Paper'} ${last}`, mode: pendingBrokerMode, connectedAt: Date.now() };
    logActivity('broker', `Connected ${b.name} (${pendingBrokerMode})`);
    saveUser(); State.modal = null; pendingBrokerMode = 'demo';
    render(); toast(`${b.name} connected.`, 'ok');
  });

  const alpacaForm = root.querySelector('form[data-form="connect-alpaca"]');
  if (alpacaForm) alpacaForm.addEventListener('submit', async e => {
    e.preventDefault();
    const f = new FormData(alpacaForm);
    const apiKeyId = (f.get('apiKeyId') || '').trim();
    const apiSecretKey = (f.get('apiSecretKey') || '').trim();
    const errEl = document.getElementById('alpaca-connect-error');
    const submitBtn = document.getElementById('alpaca-connect-submit');
    const hideError = () => { if (errEl) errEl.style.display = 'none'; };
    const showError = (msg) => { if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; } };
    hideError();
    if (!(await backendAvailable())) {
      showError('Live broker connections need this app running with its real backend — this preview build has no server to verify credentials against.');
      return;
    }
    submitBtn.disabled = true; submitBtn.textContent = 'Verifying with Alpaca…';
    try {
      const res = await fetch('/api/broker/alpaca/connect', {
        method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
        body: JSON.stringify({ apiKeyId, apiSecretKey }),
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error || 'Could not connect to Alpaca.'); submitBtn.disabled = false; submitBtn.innerHTML = `${icon('check')} Verify & Connect`; return; }
      State.user.brokers.alpaca = {
        connected: true, real: true, mode: 'demo',
        accountLabel: `Alpaca •• Paper ${data.account.accountNumber.slice(-4)}`,
        accountNumber: data.account.accountNumber, status: data.account.status,
        cash: data.account.cash, buyingPower: data.account.buyingPower,
        portfolioValue: data.account.portfolioValue, equity: data.account.equity,
        connectedAt: Date.now(),
      };
      logActivity('broker', 'Connected Alpaca (real paper-trading API)');
      await saveUser();
      State.modal = null;
      render();
      toast('Alpaca connected — real paper account verified.', 'ok');
      checkAchievements();
    } catch (err) {
      showError('Could not reach the server. Try again in a moment.');
      submitBtn.disabled = false; submitBtn.innerHTML = `${icon('check')} Verify & Connect`;
    }
  });
}

// Delegated listeners are bound ONCE to the persistent #app root (not on every
// render, which only replaces innerHTML) to avoid stacking duplicate handlers.
let _delegationBound = false;
function bindDelegationOnce() {
  if (_delegationBound) return;
  const root = document.getElementById('app');
  root.addEventListener('click', onDelegatedClick);
  root.addEventListener('input', onDelegatedInput);
  root.addEventListener('change', onDelegatedChange);
  root.addEventListener('submit', onDelegatedSubmit);
  _delegationBound = true;
}
function onDelegatedSubmit(e) {
  const commentForm = e.target.closest ? e.target.closest('[data-form="comment"]') : null;
  if (commentForm) {
    e.preventDefault();
    const id = commentForm.getAttribute('data-id');
    const input = commentForm.querySelector('input[name="text"]');
    addCommentToEntry(id, input ? input.value : '');
    return;
  }
  const waitlistForm = e.target.closest ? e.target.closest('[data-form="waitlist"]') : null;
  if (waitlistForm) {
    e.preventDefault();
    const f = new FormData(waitlistForm);
    const email = (f.get('email') || '').trim();
    if (!email || !validateEmail(email)) { toast('Enter a valid email address.', 'err'); return; }
    joinWaitlist(email, f.get('name'), email, (f.get('ref') || '').trim().toLowerCase() || null);
    return;
  }
  const aiForm = e.target.closest ? e.target.closest('[data-form="ai-generate"]') : null;
  if (aiForm) {
    e.preventDefault();
    const f = new FormData(aiForm);
    const desc = (f.get('description') || '').trim();
    if (!desc) { toast('Describe the strategy you want first.', 'err'); return; }
    const result = parseStrategyDescription(desc);
    State.draft = result.draft;
    State.editingId = null;
    State.modal = null;
    State.view = 'builder';
    State.aiGenSummary = result.matched;
    window.scrollTo(0, 0);
    render();
    toast('Strategy drafted — review what was picked up below.', 'ok');
    return;
  }
}

function onDelegatedClick(e) {
  const el = e.target.closest('[data-action]');
  // close the notifications dropdown on any click outside it
  if (State.notifOpen) {
    const clickedInsideNotif = el && (el.getAttribute('data-action') === 'toggle-notif' || el.closest('.notif-dropdown'));
    if (!clickedInsideNotif) { State.notifOpen = false; render(); }
  }
  if (!el) return;
  const action = el.getAttribute('data-action');
  if (action !== 'noop') e.preventDefault();

  switch (action) {
    case 'stop-prop': break;
    case 'toggle-notif': {
      State.notifOpen = !State.notifOpen;
      render();
      break;
    }
    case 'mark-read': {
      State.user.lastSeenActivityAt = Date.now();
      saveUser(); render();
      break;
    }
    case 'view-strategy': State.detailId = el.getAttribute('data-id'); State.view = 'detail'; window.scrollTo(0, 0); render(); break;
    case 'duplicate-strategy': {
      const s = State.user.strategies.find(x => x.id === el.getAttribute('data-id'));
      if (!s) break;
      const copy = JSON.parse(JSON.stringify(s));
      copy.id = uid(); copy.name = s.name + ' (copy)'; copy.status = 'draft'; copy.createdAt = Date.now();
      State.user.strategies.push(copy);
      logActivity('strategy', `Duplicated "${s.name}"`);
      saveUser(); render(); toast('Strategy duplicated.', 'ok');
      break;
    }
    case 'use-template': {
      const tpl = TEMPLATES[parseInt(el.getAttribute('data-idx'), 10)];
      if (!tpl) break;
      const d = blankDraft();
      Object.assign(d, {
        name: tpl.name, symbol: tpl.symbol, timeframe: tpl.timeframe, direction: tpl.direction,
        entryConditions: tpl.entryConditions.map(c => ({ id: uid(), ...c })),
        takeProfit: tpl.takeProfit, stopLoss: tpl.stopLoss, positionSizePct: tpl.positionSizePct, trailingStop: tpl.trailingStop,
      });
      State.draft = d; State.editingId = null; State.view = 'builder';
      render(); toast('Template loaded — tweak it, then save.', 'ok');
      break;
    }
    case 'copy-community': copyCommunityStrategy(el.getAttribute('data-id')); break;
    case 'view-profile': {
      const uname = el.getAttribute('data-username');
      if (!uname) break;
      State.profileUsername = uname; State.view = 'profile';
      if (uname !== State.user.username) { State.viewedProfileUser = null; loadProfileUser(uname); }
      if (State.follows === null) loadFollows();
      window.scrollTo(0, 0); render();
      break;
    }
    case 'toggle-follow': toggleFollow(el.getAttribute('data-username')); break;
    case 'set-avatar-color': {
      State.user.avatarColor = el.getAttribute('data-color');
      saveUser(); render(); toast('Avatar color updated.', 'ok');
      break;
    }
    case 'save-bio': {
      const ta = document.getElementById('bio-input');
      State.user.bio = ta ? ta.value.slice(0, 180) : State.user.bio;
      saveUser(); render(); toast('Profile saved.', 'ok');
      break;
    }
    case 'toggle-like': toggleLikeEntry(el.getAttribute('data-id')); break;
    case 'rate-strategy': rateEntry(el.getAttribute('data-id'), parseInt(el.getAttribute('data-score'), 10)); break;    case 'publish-strategy': {
      const s = State.user.strategies.find(x => x.id === el.getAttribute('data-id'));
      if (s) publishStrategy(s);
      break;
    }
    case 'unpublish-strategy': {
      const s = State.user.strategies.find(x => x.id === el.getAttribute('data-id'));
      if (s) unpublishStrategy(s);
      break;
    }
    case 'auth-tab': {
      State.authMode = el.getAttribute('data-mode'); State.authError = '';
      if (State.authMode === 'waitlist' && State.waitlist === null) loadWaitlist();
      render();
      break;
    }
    case 'copy-referral': copyToClipboard(el.getAttribute('data-link')); break;
    case 'set-code-lang': State.codeLang = el.getAttribute('data-lang'); render(); break;
    case 'set-dev-lang': State.devExampleLang = el.getAttribute('data-lang'); render(); break;
    case 'copy-raw-code': {
      const lang = el.getAttribute('data-lang');
      copyToClipboard(lang === 'pine' ? EXAMPLE_PINE : EXAMPLE_MQL5);
      break;
    }
    case 'copy-code': {
      const s = State.view === 'builder' ? State.draft : detailStrategy();
      if (!s) break;
      const lang = el.getAttribute('data-lang');
      const code = lang === 'pine' ? generatePineScript(s) : generateMQL5(s);
      copyToClipboard(code);
      break;
    }
    case 'join-waitlist-inapp': joinWaitlist(State.user.username, State.user.name, State.user.email, State.referralCode || null); break;
    case 'demo-login': handleDemoLogin(); break;
    case 'set-lang': setLang(el.getAttribute('data-lang')); break;
    case 'nav': {
      const view = el.getAttribute('data-view');
      State.view = view; State.sidebarOpen = false; window.scrollTo(0, 0);
      if (view === 'community' && State.community === null) { loadCommunity(); }
      if (view === 'markets' && State.community === null) { loadCommunity(); }
      if (view === 'feed' && State.community === null) { loadCommunity(); }
      if (view === 'broker' && State.waitlist === null) { loadWaitlist(); }
      if (view === 'achievements') {
        if (State.community === null) loadCommunity();
        if (State.follows === null) loadFollows();
      }
      if (view === 'feed' && State.follows === null) { loadFollows(); }
      if (view === 'profile') {
        State.profileUsername = State.user.username;
        State.viewedProfileUser = null;
        if (State.follows === null) loadFollows();
        if (State.community === null) loadCommunity();
      }
      render();
      break;
    }
    case 'toggle-sidebar': State.sidebarOpen = !State.sidebarOpen; render(); break;
    case 'logout': handleLogout(); break;

    case 'new-strategy': State.draft = blankDraft(); State.editingId = null; State.aiGenSummary = null; State.view = 'builder'; render(); break;
    case 'dismiss-ai-summary': State.aiGenSummary = null; render(); break;
    case 'run-montecarlo': {
      const id = el.getAttribute('data-id');
      const s = State.user.strategies.find(x => x.id === id);
      if (!s || !s.backtest) break;
      State.mcCache = State.mcCache || {};
      State.mcCache[id] = runMonteCarlo(s.backtest, 300);
      render();
      toast('Monte Carlo simulation complete.', 'ok');
      break;
    }
    case 'set-optimize-goal': State.optimizeGoal = el.getAttribute('data-goal'); render(); break;
    case 'run-optimize': {
      const id = el.getAttribute('data-id');
      const s = State.user.strategies.find(x => x.id === id);
      if (!s || !s.backtest) break;
      State.optimizeCache = State.optimizeCache || {};
      State.optimizeCache[id] = optimizeStrategy(s, State.optimizeGoal || 'totalReturn');
      render();
      toast('Optimization complete.', 'ok');
      break;
    }
    case 'apply-optimized': {
      const id = el.getAttribute('data-id');
      const idx = parseInt(el.getAttribute('data-idx'), 10) || 0;
      const s = State.user.strategies.find(x => x.id === id);
      const cached = State.optimizeCache && State.optimizeCache[id];
      if (!s || !cached || !cached.top[idx]) break;
      const r = cached.top[idx];
      s.takeProfit = r.tp; s.stopLoss = r.sl; s.positionSizePct = r.size;
      if (s.entryConditions[0]) s.entryConditions[0].value = r.val;
      s.backtest = runBacktest(s);
      logActivity('backtest', `Applied optimized parameters to "${s.name}"`);
      saveUser();
      delete State.optimizeCache[id];
      if (State.mcCache) delete State.mcCache[id];
      State.user.hasOptimized = true;
      render();
      toast('Optimized parameters applied — backtest re-run.', 'ok');
      checkAchievements();
      break;
    }
    case 'edit-strategy': {
      const s = State.user.strategies.find(x => x.id === el.getAttribute('data-id'));
      if (s) { State.draft = JSON.parse(JSON.stringify(s)); State.editingId = s.id; State.aiGenSummary = null; State.view = 'builder'; render(); }
      break;
    }
    case 'delete-strategy': {
      const id = el.getAttribute('data-id');
      const s = State.user.strategies.find(x => x.id === id);
      State.modal = { type: 'confirm', title: 'Delete strategy?', body: `"${s ? s.name : 'This strategy'}" will be permanently removed.`, confirmLabel: 'Delete', onConfirm: () => {
        State.user.strategies = State.user.strategies.filter(x => x.id !== id);
        saveUser(); render(); toast('Strategy deleted.', 'info');
      }};
      render();
      break;
    }
    case 'deploy-strategy': {
      const id = el.getAttribute('data-id'); const mode = el.getAttribute('data-mode');
      const s = State.user.strategies.find(x => x.id === id);
      if (!s) break;
      const connectedBrokers = Object.entries(State.user.brokers || {}).filter(([, b]) => b.connected);
      if (!connectedBrokers.length) { toast('Connect a broker before deploying a strategy.', 'err'); State.view = 'broker'; if (State.waitlist === null) loadWaitlist(); render(); break; }
      if (connectedBrokers.length > 1) {
        State.modal = { type: 'choose-broker', stratId: id, mode, brokers: connectedBrokers.map(([bid]) => bid) };
        render(); break;
      }
      deployStrategyToBroker(s, mode, connectedBrokers[0][0]);
      break;
    }
    case 'choose-broker-confirm': {
      const m = State.modal;
      const s = State.user.strategies.find(x => x.id === m.stratId);
      if (s) deployStrategyToBroker(s, m.mode, el.getAttribute('data-broker'));
      State.modal = null;
      break;
    }

    case 'set-direction': ensureDraft(); State.draft.direction = el.getAttribute('data-val'); render(); break;
    case 'apply-market-symbol': {
      ensureDraft();
      State.draft.symbol = el.getAttribute('data-symbol');
      State.view = 'builder';
      window.scrollTo(0, 0); render();
      toast(`Now building for ${State.draft.symbol}.`, 'ok');
      break;
    }
    case 'markets-filter': State.marketsFilter = el.getAttribute('data-val'); render(); break;
    case 'set-asset-class': {
      ensureDraft();
      const group = SYMBOL_GROUPS.find(g => g.id === el.getAttribute('data-val'));
      if (group && !group.symbols.includes(State.draft.symbol)) State.draft.symbol = group.symbols[0];
      render();
      break;
    }
    case 'add-condition': ensureDraft(); State.draft.entryConditions.push({ id: uid(), indicator: 'rsi', operator: 'is below', value: '30', logic: 'AND' }); render(); break;
    case 'remove-condition': ensureDraft(); State.draft.entryConditions = State.draft.entryConditions.filter(c => c.id !== el.getAttribute('data-id')); render(); break;
    case 'run-backtest': {
      ensureDraft();
      if (!State.draft.name.trim()) { toast('Give your strategy a name first.', 'err'); break; }
      State.draft.backtest = runBacktest(State.draft);
      logActivity('backtest', `Backtested "${State.draft.name}"`);
      render(); toast('Backtest complete.', 'ok');
      checkAchievements();
      break;
    }
    case 'save-strategy': {
      ensureDraft();
      const d = State.draft;
      const isNew = !State.editingId;
      if (!d.name.trim()) { toast('Give your strategy a name first.', 'err'); break; }
      if (State.editingId) {
        const idx = State.user.strategies.findIndex(x => x.id === State.editingId);
        if (idx > -1) State.user.strategies[idx] = d;
        logActivity('strategy', `Updated "${d.name}"`);
      } else {
        d.id = uid(); d.createdAt = Date.now();
        State.user.strategies.push(d);
        logActivity('strategy', `Created "${d.name}"`);
      }
      saveUser(); State.view = 'strategies'; State.draft = null; State.editingId = null; State.aiGenSummary = null;
      render(); toast('Strategy saved.', 'ok');
      if (isNew) { awardXP(15); checkAchievements(); }
      break;
    }

    case 'open-connect-modal': State.modal = { type: 'connect-broker', id: el.getAttribute('data-id') }; pendingBrokerMode = 'demo'; render(); break;
    case 'open-ai-generate': State.modal = { type: 'ai-generate' }; render(); break;
    case 'set-broker-mode': {
      pendingBrokerMode = el.getAttribute('data-val');
      el.parentElement.querySelectorAll('button').forEach(b => b.className = '');
      el.className = pendingBrokerMode === 'live' ? 'on-short' : 'on-both';
      break;
    }
    case 'disconnect-broker': {
      const id = el.getAttribute('data-id'); const b = brokerById(id);
      State.modal = { type: 'confirm', title: `Disconnect ${b.name}?`, body: 'Strategies deployed live on this broker will be paused.', confirmLabel: 'Disconnect', onConfirm: () => {
        delete State.user.brokers[id];
        State.user.strategies.forEach(s => { if (s.status === 'live') s.status = 'demo'; });
        saveUser(); render(); toast(`${b.name} disconnected.`, 'info');
      }};
      render();
      break;
    }
    case 'disconnect-alpaca': {
      State.modal = { type: 'confirm', title: 'Disconnect Alpaca?', body: 'This removes your stored API credentials from the server and pauses any strategies deployed live on this broker.', confirmLabel: 'Disconnect', onConfirm: () => { disconnectAlpaca(); } };
      render();
      break;
    }
    case 'alpaca-test-order': sendAlpacaTestOrder(); break;
    case 'close-modal': State.modal = null; render(); break;
    case 'confirm-yes': { const cb = State.modal && State.modal.onConfirm; State.modal = null; if (cb) cb(); break; }

    case 'settings-tab': State.settingsTab = el.getAttribute('data-tab'); render(); break;
    case 'save-profile': {
      const name = root_() .querySelector('[data-field="profile-name"]').value.trim();
      const email = document.querySelector('[data-field="profile-email"]').value.trim();
      if (!name || !validateEmail(email)) { toast('Enter a valid name and email.', 'err'); break; }
      State.user.name = name; State.user.email = email;
      saveUser(); render(); toast('Profile updated.', 'ok');
      break;
    }
    case 'change-password': {
      const cur = document.querySelector('[data-field="cur-pass"]').value;
      const next = document.querySelector('[data-field="new-pass"]').value;
      if (cur !== State.user.password) { toast('Current password is incorrect.', 'err'); break; }
      if (!next || next.length < 6) { toast('New password must be at least 6 characters.', 'err'); break; }
      State.user.password = next; saveUser(); toast('Password updated.', 'ok');
      break;
    }
    case 'delete-account': {
      State.modal = { type: 'confirm', title: 'Delete account?', body: 'This permanently removes your account and all strategies. This cannot be undone.', confirmLabel: 'Delete account', onConfirm: async () => {
        await storeDelete('user:' + State.user.username, true);
        await handleLogout();
        toast('Account deleted.', 'info');
      }};
      render();
      break;
    }
  }
}
function root_() { return document.getElementById('app'); }
function deployStrategyToBroker(s, mode, brokerId) {
  if (!s.backtest) s.backtest = runBacktest(s);
  s.status = mode; s.brokerId = brokerId;
  const b = brokerById(brokerId);
  logActivity(mode === 'live' ? 'deploy' : 'strategy', `${mode === 'live' ? 'Went live with' : 'Deployed to demo:'} "${s.name}" on ${b ? b.name : 'broker'}`);
  saveUser(); render(); toast(`"${s.name}" is now ${mode === 'live' ? 'trading live' : 'on demo'} via ${b ? b.name : 'your broker'}.`, 'ok');
  checkAchievements();
}

const DRAFT_INPUT_FIELDS = ['name', 'takeProfit', 'stopLoss', 'positionSizePct', 'cond-value'];
function onDelegatedInput(e) {
  const t = e.target;
  const field = t.getAttribute('data-field');
  if (!field) return;
  if (field === 'strat-search') { State.stratQuery = t.value; updateStrategyResults(); return; }
  if (field === 'community-search') { State.communityQuery = t.value; updateCommunityResults(); return; }
  if (field === 'markets-search') { State.marketsQuery = t.value; updateMarketsResults(); return; }
  if (DRAFT_INPUT_FIELDS.indexOf(field) === -1) return;
  ensureDraft();
  const d = State.draft;
  if (field === 'name') d.name = t.value;
  else if (field === 'takeProfit') d.takeProfit = parseFloat(t.value) || 0;
  else if (field === 'stopLoss') d.stopLoss = parseFloat(t.value) || 0;
  else if (field === 'positionSizePct') d.positionSizePct = parseFloat(t.value) || 0;
  else if (field === 'cond-value') { const c = d.entryConditions.find(c => c.id === t.getAttribute('data-id')); if (c) c.value = t.value; }
  else return;
  // live-update summary panel only (avoid full re-render stealing focus)
  updateSummaryOnly();
}
function onDelegatedChange(e) {
  const t = e.target;
  const field = t.getAttribute('data-field');
  if (field === 'strat-status-filter') { State.stratStatus = t.value; updateStrategyResults(); return; }
  if (field === 'strat-sort') { State.stratSort = t.value; updateStrategyResults(); return; }
  if (field === 'community-sort') { State.communitySort = t.value; updateCommunityResults(); return; }
  if (field === 'symbol') { ensureDraft(); State.draft.symbol = t.value; updateSummaryOnly(); return; }
  if (field === 'timeframe') { ensureDraft(); State.draft.timeframe = t.value; updateSummaryOnly(); return; }
  if (field === 'trailingStop') { ensureDraft(); State.draft.trailingStop = t.checked; return; }
  if (field === 'cond-indicator') {
    ensureDraft();
    const c = State.draft.entryConditions.find(c => c.id === t.getAttribute('data-id'));
    if (c) { c.indicator = t.value; const ind = indicatorById(t.value); c.operator = ind.ops[0]; c.value = ''; }
    render();
    return;
  }
  if (field === 'cond-operator') {
    ensureDraft();
    const c = State.draft.entryConditions.find(c => c.id === t.getAttribute('data-id'));
    if (c) c.operator = t.value;
    return;
  }
  if (field === 'cond-logic') {
    ensureDraft();
    const c = State.draft.entryConditions.find(c => c.id === t.getAttribute('data-id'));
    if (c) c.logic = t.value;
    t.className = 'logic-select' + (t.value === 'OR' ? ' is-or' : '');
    return;
  }
}
function updateSummaryOnly() {
  // Cheap partial refresh: re-render only the summary card + risk fields dependent text
  const d = State.draft;
  const rows = document.querySelectorAll('.summary-row b');
  if (!rows.length) return;
  const vals = [d.symbol, d.timeframe, d.direction.toUpperCase(), d.entryConditions.length, '+' + d.takeProfit + '%', '-' + d.stopLoss + '%', '1 : ' + (d.takeProfit / (d.stopLoss || 1)).toFixed(2), d.positionSizePct + '% / trade'];
  rows.forEach((el, i) => { if (vals[i] !== undefined) el.textContent = vals[i]; });
}

/* =================================== INIT ========================================= */
window.addEventListener('resize', () => renderAllCharts());
setInterval(tickLivePositions, 2500);
(async function init() {
  document.documentElement.lang = State.lang === 'ar' ? 'ar' : 'en';
  document.documentElement.dir = State.lang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#5C6579;font-family:'Space Grotesk',sans-serif;">Loading VaticTrader…</div>`;
  try { const ref = new URLSearchParams(location.search).get('ref'); if (ref) State.referralCode = ref; } catch (e) {}
  bindDelegationOnce();
  await loadSession();
  render();
  if (State.session && State.user) { loadCommunity(); loadFollows(); updateStreak(); }
})();
