<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VaticTrader — Algorithmic Trading Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A13;
  --bg-elevated:#0F0D1A;
  --panel:#15131F;
  --panel-alt:#1B1830;
  --panel-hover:#221E3A;
  --border:#2C2844;
  --border-soft:#201D33;
  --text:#EDEAF7;
  --text-dim:#A3A0C2;
  --text-faint:#6B6890;
  --brand:#8677F5;
  --brand-dim:#4F3FA8;
  --brand-bg:rgba(134,119,245,0.12);
  --gold:#D4AF6A;
  --gold-dim:#8A6F3D;
  --gold-bg:rgba(212,175,106,0.12);
  --long:#2ED9A8;
  --long-bg:rgba(46,217,168,0.1);
  --short:#FB6A6A;
  --short-bg:rgba(251,106,106,0.1);
  --info:#38BDF8;
  --info-bg:rgba(56,189,248,0.1);
  --radius:12px;
  --radius-sm:7px;
  --shadow-card:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
  --shadow-elevated:0 4px 12px rgba(0,0,0,0.35), 0 24px 48px -16px rgba(0,0,0,0.6);
  --shadow-gold:0 0 0 1px rgba(212,175,106,0.25), 0 4px 16px -4px rgba(212,175,106,0.25);
  --font-display:'Space Grotesk',ui-sans-serif,sans-serif;
  --font-body:'Inter',ui-sans-serif,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --font-arabic:'Cairo',ui-sans-serif,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(134,119,245,0.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(56,189,248,0.05), transparent 60%),
    radial-gradient(ellipse 600px 400px at 50% 110%, rgba(212,175,106,0.035), transparent 60%);
  pointer-events:none;
  z-index:0;
}
/* Signature texture: a faint compass-star lattice, used only behind the
   auth hero — the one place we spend this visual "boldness". */
.lattice-bg{
  position:absolute; inset:0; pointer-events:none; overflow:hidden;
  opacity:0.22;
  mask-image:radial-gradient(ellipse 65% 60% at 30% 55%, transparent 30%, black 100%);
  -webkit-mask-image:radial-gradient(ellipse 65% 60% at 30% 55%, transparent 30%, black 100%);
}
.lattice-bg svg{ position:absolute; width:100%; height:100%; }
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--brand);color:#0A0A14;}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#232B39;border-radius:8px;border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:#2C3547;}

/* Inline SVG icons default to a sane size; specific contexts override */
.ic-wrap{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ic-wrap svg{width:16px;height:16px;display:block;}
.brand-mark .ic-wrap svg{width:27px;height:27px;}
.stat-card .ic-wrap svg,.delta .ic-wrap svg{width:13px;height:13px;}
.activity-item .ic .ic-wrap svg{width:14px;height:14px;}
.checklist-item .tick .ic-wrap svg{width:11px;height:11px;}
.empty-state .ic-wrap svg{width:36px;height:36px;}
.node-remove .ic-wrap svg{width:15px;height:15px;}
.direction-toggle .ic-wrap svg{width:14px;height:14px;}
.btn-icon .ic-wrap svg{width:15px;height:15px;}
.settings-nav .ic-wrap svg,.nav-group .ic-wrap svg{width:16px;height:16px;}

h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono);}
.muted{color:var(--text-dim);}
.faint{color:var(--text-faint);}

#app{position:relative;z-index:1;min-height:100vh;}
.hidden{display:none !important;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;border-radius:var(--radius-sm);border:1px solid transparent;
  font-size:13.5px;font-weight:600;transition:all .15s ease;white-space:nowrap;
}
.btn-primary{background:linear-gradient(135deg,#9C8CFF,#6C5CE0);color:#161029;box-shadow:0 4px 14px -2px rgba(134,119,245,0.55);border:1px solid rgba(255,255,255,0.12);}
.btn-primary:hover{background:linear-gradient(135deg,#AB9DFF,#7C6CF0);box-shadow:0 6px 20px -2px rgba(134,119,245,0.7);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border);}
.btn-ghost:hover{background:var(--panel-hover);border-color:#2C3547;}
.btn-outline{background:transparent;color:var(--brand);border-color:var(--brand-dim);}
.btn-outline:hover{background:var(--brand-bg);}
.btn-danger{background:transparent;color:var(--short);border-color:rgba(255,98,89,0.35);}
.btn-danger:hover{background:var(--short-bg);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none !important;}
.btn-icon{padding:8px;border-radius:var(--radius-sm);background:transparent;border:1px solid var(--border);color:var(--text-dim);}
.btn-icon:hover{color:var(--text);border-color:#2C3547;}

/* ---------- Form elements ---------- */
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field .hint{font-size:12px;color:var(--text-faint);margin-top:5px;}
.input,.select{
  width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:var(--radius-sm);font-size:14px;transition:border-color .15s;
}
.input:focus,.select:focus{border-color:var(--brand-dim);outline:none;}
.input::placeholder{color:var(--text-faint);}
.row{display:flex;gap:12px;}
.row > .field{flex:1;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-dim);}

/* ---------- Cards / panels ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);}
.panel-pad{padding:20px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.panel-head h3{font-size:15px;}
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;
}
.badge-brand{background:var(--brand-bg);color:var(--brand);}
.badge-long{background:var(--long-bg);color:var(--long);}
.badge-short{background:var(--short-bg);color:var(--short);}
.badge-info{background:var(--info-bg);color:var(--info);}
.badge-dim{background:var(--panel-alt);color:var(--text-faint);border:1px solid var(--border);}
.badge .ic-wrap svg{width:10px;height:10px;}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ================= AUTH / LANDING ================= */
.auth-shell{min-height:100vh;display:flex;}
.auth-side{
  flex:1.1;position:relative;padding:56px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(160deg,#120F20 0%,#0C0A16 55%,#0B0A13 100%);
  border-right:1px solid var(--border-soft);
  overflow:hidden;
}
.auth-side .glow{position:absolute;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,175,106,0.13),transparent 65%);top:-160px;left:-160px;pointer-events:none;}
.brand-mark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;position:relative;z-index:1;}
.brand-mark .glyph{width:30px;height:30px;position:relative;}
.auth-pitch{position:relative;z-index:1;max-width:460px;}
.hero-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:20px;background:rgba(134,119,245,0.12);border:1px solid rgba(134,119,245,0.35);color:#B7ACFF;font-size:11px;font-weight:700;letter-spacing:.06em;margin-bottom:16px;}
.hero-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--long);box-shadow:0 0 6px var(--long);flex-shrink:0;}
.auth-pitch h1{font-size:38px;line-height:1.12;margin-bottom:18px;}
.auth-pitch h1 .accent{background:linear-gradient(90deg,var(--brand),#B7ACFF);-webkit-background-clip:text;background-clip:text;color:transparent;}
.auth-pitch p{color:var(--text-dim);font-size:15px;line-height:1.65;margin-bottom:28px;}
.pitch-stats{display:flex;gap:28px;position:relative;z-index:1;}
.pitch-stats div b{display:block;font-family:var(--font-mono);font-size:22px;color:var(--text);}
.pitch-stats div span{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.radar-panel{position:relative;z-index:1;margin-top:26px;}
.radar-visual-wrap{position:relative;width:190px;height:190px;flex-shrink:0;}
.radar-visual{width:190px;height:190px;}
.radar-visual svg{width:100%;height:100%;}
.radar-callout{position:absolute;display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;background:rgba(21,19,31,0.92);border:1px solid var(--border);font-size:10px;color:var(--text-dim);white-space:nowrap;backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,0.35);}
.radar-callout b{color:var(--text);}
.radar-signal-row{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.radar-signal-row b{color:var(--text);font-weight:600;}
.dot-teal,.dot-gold,.dot-coral{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-teal{background:var(--long);box-shadow:0 0 6px var(--long);}
.dot-gold{background:var(--gold);box-shadow:0 0 6px var(--gold);}
.dot-coral{background:var(--short);box-shadow:0 0 6px var(--short);}
.auth-form-side{flex:0.9;display:flex;align-items:center;justify-content:center;padding:40px;min-width:400px;}
.auth-card{width:100%;max-width:380px;}
.auth-tabs{display:flex;background:var(--panel-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;margin-bottom:26px;}
.auth-tab{flex:1;text-align:center;padding:9px 4px;border-radius:5px;font-size:12px;font-weight:600;color:var(--text-faint);}
.auth-tab .ic-wrap{display:none;}
.auth-tab.active{background:var(--panel-hover);color:var(--text);}
.auth-card h2{font-size:21px;margin-bottom:6px;}
.auth-card .sub{color:var(--text-faint);font-size:13px;margin-bottom:24px;}
.auth-error{background:var(--short-bg);border:1px solid rgba(255,98,89,0.3);color:#FF9089;padding:10px 12px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:16px;}
.form-error{background:var(--short-bg);border:1px solid rgba(255,98,89,0.3);color:#FF9089;padding:10px 12px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:14px;}
.auth-foot{text-align:center;margin-top:18px;font-size:12.5px;color:var(--text-faint);}
.demo-note{margin-top:22px;padding:12px 14px;background:var(--panel-alt);border:1px dashed var(--border);border-radius:var(--radius-sm);font-size:12px;color:var(--text-faint);line-height:1.6;}

/* ================= APP SHELL ================= */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;background:var(--bg-elevated);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;
}
.sidebar .brand-mark{padding:6px 8px 22px;font-size:17px;}
.nav-group{margin-bottom:4px;}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);padding:14px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-size:13.5px;font-weight:500;margin-bottom:2px;transition:all .12s;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--panel-hover);color:var(--text);}
.nav-item.active{background:var(--brand-bg);color:var(--brand);}
.nav-item.active svg{opacity:1;}
.sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border-soft);}
.plan-chip{display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;margin-bottom:8px;}
.plan-chip.is-pro{border-color:rgba(212,175,106,0.35);background:linear-gradient(135deg,rgba(212,175,106,0.08),var(--panel) 60%);}
.plan-chip.is-pro .plan-badge{color:var(--gold);}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius-sm);}
.user-chip:hover{background:var(--panel-hover);}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand-bg);color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:12px;flex-shrink:0;transition:transform .15s ease;}
.user-chip .who{flex:1;min-width:0;}
.user-chip .who b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-chip .who span{font-size:11px;color:var(--text-faint);}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:16px 28px;
  border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:rgba(11,10,19,0.85);backdrop-filter:blur(8px);z-index:5;
}
.topbar h2{font-size:18px;}
.topbar .crumb{font-size:12px;color:var(--text-faint);margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.content{padding:28px;max-width:1220px;width:100%;margin:0 auto;flex:1;}

/* ================= DASHBOARD ================= */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;}
.stat-card{padding:16px 18px;}
.stat-card .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:8px;}
.stat-card .value{font-family:var(--font-mono);font-size:24px;font-weight:600;}
.stat-card .delta{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:4px;}
.delta.up{color:var(--long);}
.delta.down{color:var(--short);}
.chart-wrap{position:relative;height:230px;}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:50px 20px;color:var(--text-faint);
}
.empty-state svg{width:36px;height:36px;margin-bottom:14px;opacity:.5;}
.empty-state p{font-size:13px;max-width:280px;margin:0 0 16px;}
.activity-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-soft);}
.activity-item:last-child{border-bottom:none;}
.activity-item .ic{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.activity-item .body{flex:1;min-width:0;}
.activity-item .body b{font-size:13px;font-weight:600;}
.activity-item .body p{margin:2px 0 0;font-size:12px;color:var(--text-faint);}
.checklist-item{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13px;}
.checklist-item .tick{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.checklist-item.done .tick{background:var(--long);border-color:var(--long);color:#062;}
.checklist-item.done span{color:var(--text-faint);text-decoration:line-through;}

/* ================= STRATEGIES LIST ================= */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;}
.strategy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.strategy-card{padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s;position:relative;}
.strategy-card-featured{border-color:var(--gold);background:linear-gradient(160deg,rgba(212,175,106,0.06),var(--panel) 60%);padding-top:34px;}
.top-pick-badge{position:absolute;top:0;left:16px;transform:translateY(-50%);display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:12px;background:linear-gradient(135deg,#E8C888,var(--gold));color:#3A2E10;font-size:10.5px;font-weight:700;letter-spacing:.03em;box-shadow:0 2px 8px -1px rgba(212,175,106,0.5);}
.top-pick-badge svg{width:11px;height:11px;}
.strategy-card:hover{border-color:#2C3547;}
.strategy-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.strategy-card h4{font-size:15px;margin-bottom:3px;}
.strategy-card .meta{font-size:12px;color:var(--text-faint);font-family:var(--font-mono);}
.strategy-card .spark{height:44px;}
.strategy-card .stats-row{display:flex;justify-content:space-between;font-size:12px;}
.strategy-card .stats-row b{display:block;font-family:var(--font-mono);font-size:13.5px;color:var(--text);}
.strategy-card .actions{display:flex;gap:8px;margin-top:4px;}

/* ================= STRATEGY BUILDER ================= */
.builder-grid{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start;}
.steps-nav{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.step-chip{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--panel-alt);color:var(--text-faint);border:1px solid var(--border);}
.step-chip.on{background:var(--brand-bg);color:var(--brand);border-color:var(--brand-dim);}

.chain{display:flex;flex-direction:column;gap:0;}
.chain-node{
  display:flex;align-items:center;gap:12px;background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;position:relative;
}
.chain-connector{display:flex;align-items:center;gap:8px;padding:6px 0 6px 24px;}
.chain-connector .line{width:1px;height:14px;background:var(--border);margin-left:1px;}
.chain-connector select{width:auto;padding:3px 22px 3px 10px;font-size:11.5px;font-weight:700;text-transform:uppercase;background:var(--panel-alt);color:var(--brand);border:1px solid var(--brand-dim);border-radius:20px;cursor:pointer;}
.logic-select.is-or{color:var(--info);border-color:var(--info);}
.node-badge{width:30px;height:30px;border-radius:8px;background:var(--brand-bg);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-mono);font-size:12px;font-weight:700;}
.node-fields{flex:1;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px;}
.node-fields select,.node-fields input{padding:7px 9px;font-size:12.5px;}
.node-remove{color:var(--text-faint);background:transparent;border:none;padding:4px;flex-shrink:0;}
.node-remove:hover{color:var(--short);}
.add-node-btn{margin-top:12px;}

.direction-toggle{display:flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;}
.direction-toggle button{flex:1;padding:9px;border-radius:5px;background:transparent;border:none;color:var(--text-faint);font-size:13px;font-weight:600;}
.direction-toggle button.on-long{background:var(--long-bg);color:var(--long);}
.direction-toggle button.on-short{background:var(--short-bg);color:var(--short);}
.direction-toggle button.on-both{background:var(--info-bg);color:var(--info);}

.asset-pills{display:flex;gap:6px;flex-wrap:wrap;}
.asset-pill{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--bg-elevated);color:var(--text-faint);border:1px solid var(--border);}
.asset-pill.on{background:var(--brand-bg);color:var(--brand);border-color:var(--brand-dim);}
.asset-tag{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:var(--panel-alt);color:var(--text-faint);border:1px solid var(--border);}

.instrument-chip{display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;}
.instrument-chip b{font-size:14px;}

.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.market-card{padding:14px;transition:border-color .15s ease,transform .15s ease;}
.market-card-featured{border-color:var(--gold);background:linear-gradient(160deg,rgba(212,175,106,0.07),var(--panel) 65%);}
.market-avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;font-family:var(--font-mono);flex-shrink:0;}
.market-badge-row{margin:6px 0 2px;}
.badge-strong-lean{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:12px;}
.badge-strong-lean svg{width:11px;height:11px;}
.badge-strong-long{background:var(--long-bg);color:var(--long);}
.badge-strong-short{background:var(--short-bg);color:var(--short);}
.market-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.market-top .delta{font-size:11.5px;display:flex;align-items:center;gap:3px;}
.market-top .delta .ic-wrap svg{width:11px;height:11px;}
.market-price{font-size:19px;font-weight:600;}
.market-currency{font-size:11px;font-weight:500;color:var(--text-faint);margin-left:2px;}

.markets-hero{display:flex;align-items:center;gap:24px;padding:22px 26px;position:relative;overflow:hidden;}
.markets-hero-graphic{width:88px;height:88px;flex-shrink:0;}
.markets-hero-graphic .ic-wrap,.markets-hero-graphic .ic-wrap svg{width:88px;height:88px;}
.markets-hero-copy h3{font-size:17px;margin-bottom:6px;}
.markets-hero-copy p{font-size:13px;line-height:1.55;margin:0;max-width:560px;}
.pill-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:7px;font-weight:600;}

.summary-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
.summary-row:last-child{border-bottom:none;}
.summary-row b{font-family:var(--font-mono);}

.backtest-result{margin-top:16px;}
.bt-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.bt-stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;}
.bt-stat .l{font-size:10.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px;}
.bt-stat .v{font-family:var(--font-mono);font-size:16px;font-weight:600;}

/* ================= BROKER CONNECTIONS ================= */
.broker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.broker-card{padding:18px;display:flex;flex-direction:column;gap:12px;}
.broker-stats-row{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);}
.broker-stats-row > div{flex:1;display:flex;flex-direction:column;gap:2px;}
.broker-stats-row .l{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-faint);}
.broker-stats-row .v{font-family:var(--font-mono);font-size:13px;font-weight:600;}
.broker-card .top{display:flex;align-items:center;gap:12px;}
.broker-logo{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;flex-shrink:0;}
.broker-card h4{font-size:14.5px;}
.broker-card .desc{font-size:12px;color:var(--text-faint);line-height:1.5;}
.partner-disclosure{border-color:var(--info);background:linear-gradient(160deg,rgba(56,189,248,0.06),transparent);}
.featured-broker{border-color:var(--brand-dim);}

/* ================= SETTINGS ================= */
.settings-grid{display:grid;grid-template-columns:200px 1fr;gap:24px;}
.settings-nav{display:flex;flex-direction:column;gap:2px;}
.settings-nav .nav-item{color:var(--text-dim);}
.settings-section{margin-bottom:28px;}
.settings-section:last-child{margin-bottom:0;}
.danger-box{border:1px solid rgba(255,98,89,0.3);background:var(--short-bg);border-radius:var(--radius);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}

/* ================= MODAL / TOAST ================= */
.modal-overlay{position:fixed;inset:0;background:rgba(6,8,11,0.7);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:440px;padding:24px;max-height:88vh;overflow-y:auto;}
.modal h3{font-size:17px;margin-bottom:4px;}
.modal .sub{font-size:12.5px;color:var(--text-faint);margin-bottom:20px;}
.modal-close{position:absolute;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;}

.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--long);
  padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;min-width:240px;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);animation:toastIn .2s ease;
}
.toast.err{border-left-color:var(--short);}
.toast.info{border-left-color:var(--info);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------------- Notifications dropdown ---------------- */
.notif-dropdown{
  position:absolute;top:calc(100% + 10px);right:0;width:320px;z-index:60;
  box-shadow:0 16px 40px rgba(0,0,0,0.5);animation:toastIn .15s ease;
}

/* ---------------- Toolbar / search / filters ---------------- */
.search-box{position:relative;flex:1;max-width:280px;}
.search-box .ic-wrap{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);}
.search-box .ic-wrap svg{width:14px;height:14px;}
.search-box input{padding-left:32px;}
.filter-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.filter-row .select{width:auto;min-width:130px;}

/* ---------------- Templates ---------------- */
.template-card{padding:18px;display:flex;flex-direction:column;gap:10px;}
.template-card .badges{display:flex;gap:6px;flex-wrap:wrap;}
.template-card .blurb{font-size:12.5px;color:var(--text-dim);line-height:1.55;flex:1;}
.condition-tag{font-family:var(--font-mono);font-size:11px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-dim);padding:3px 8px;border-radius:5px;}

/* ---------------- Strategy detail / trade log ---------------- */
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12.5px;font-weight:600;margin-bottom:14px;}
.back-link:hover{color:var(--text);}
.trade-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.trade-table th{text-align:left;padding:9px 10px;color:var(--text-faint);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;border-bottom:1px solid var(--border);}
.trade-table td{padding:9px 10px;border-bottom:1px solid var(--border-soft);font-family:var(--font-mono);}
.trade-table tr:last-child td{border-bottom:none;}
.trade-table .side-long{color:var(--long);font-family:var(--font-body);font-weight:600;}
.trade-table .side-short{color:var(--short);font-family:var(--font-body);font-weight:600;}

/* ---------------- Gamification: XP, levels, streak ---------------- */
.level-block{width:100%;}
.level-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.level-badge{font-size:13px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:5px;}
.level-badge .ic-wrap svg{width:13px;height:13px;}
.xp-text{font-size:12px;color:var(--text-dim);}
.xp-bar{height:8px;border-radius:5px;background:var(--bg-elevated);border:1px solid var(--border);overflow:hidden;}
.xp-bar.thin{height:4px;border:none;}
.xp-fill{height:100%;background:linear-gradient(90deg,#4A3FA0,var(--brand));border-radius:5px;}
.level-mini{padding:9px 10px;border-radius:var(--radius-sm);margin-bottom:8px;}
.level-mini:hover{background:var(--panel-hover);}
.level-mini-top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;color:var(--text-dim);margin-bottom:5px;}
.level-mini-top .ic-wrap svg{width:11px;height:11px;color:var(--brand);}
.stat-mini{display:flex;flex-direction:column;gap:2px;}
.stat-mini b{font-family:var(--font-mono);font-size:17px;display:flex;align-items:center;gap:5px;}
.stat-mini b .ic-wrap svg{width:14px;height:14px;color:var(--brand);}
.stat-mini span{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}

/* ---------------- Achievements ---------------- */
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.achievement-card{padding:18px;text-align:center;transition:transform .15s, border-color .15s;}
.achievement-card.locked{opacity:.45;filter:grayscale(0.6);}
.achievement-card.unlocked{border-color:var(--brand-dim);}
.achievement-card.unlocked:hover{transform:translateY(-2px);}
.achievement-icon{width:44px;height:44px;border-radius:12px;background:var(--brand-bg);color:var(--brand);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.achievement-card.locked .achievement-icon{background:var(--panel-alt);color:var(--text-faint);}
.achievement-icon .ic-wrap svg{width:22px;height:22px;}
.achievement-card h4{font-size:13.5px;margin-bottom:5px;}
.achievement-card p{font-size:11.5px;color:var(--text-faint);line-height:1.5;margin:0 0 10px;min-height:32px;}

/* ---------------- Waitlist ---------------- */
.waitlist-confirm{text-align:center;padding:6px 0;}
.waitlist-position{font-family:var(--font-mono);font-size:52px;font-weight:700;color:var(--brand);line-height:1;text-align:center;}
.referral-box{display:flex;gap:8px;}
.referral-box input{flex:1;}
.waitlist-inline{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.waitlist-cta{border-color:var(--brand-dim);background:linear-gradient(160deg,rgba(232,163,61,0.06),transparent);}
.streak-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--brand);}
.streak-chip .ic-wrap svg{width:13px;height:13px;}

/* ---------------- Card hover polish (engagement) ---------------- */
.strategy-card,.template-card,.market-card,.broker-card{transition:transform .15s ease, border-color .15s ease;}
.strategy-card:hover,.template-card:hover,.market-card:hover,.broker-card:hover{transform:translateY(-2px);border-color:#2C3547;}
.trend-row .avatar.clickable:hover,.post-head .avatar.clickable:hover{transform:scale(1.06);}

/* ---------------- Risk analytics ---------------- */
.risk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.risk-stat{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
.risk-stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:5px;font-weight:600;}
.risk-stat .v{font-family:var(--font-mono);font-size:19px;font-weight:600;margin-bottom:4px;}
.risk-stat .d{font-size:11px;color:var(--text-faint);line-height:1.4;}

/* ---------------- Strategy review (rule-based) ---------------- */
.review-list{display:flex;flex-direction:column;gap:9px;}
.review-item{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.5;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg-elevated);border:1px solid var(--border);}
.review-item .ic-wrap{flex-shrink:0;margin-top:1px;}
.review-item.review-good{border-color:rgba(46,217,168,0.3);}
.review-item.review-good .ic-wrap{color:var(--long);}
.review-item.review-warning{border-color:rgba(251,106,106,0.3);}
.review-item.review-warning .ic-wrap{color:var(--short);}
.review-item.review-info .ic-wrap{color:var(--info);}

/* ---------------- Robustness testing ---------------- */
.mc-result .grid-4{margin-bottom:0;}
.consistency-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.consistency-half{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;}
.consistency-half .l{font-size:10.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px;font-weight:600;}
.consistency-half .v{font-family:var(--font-mono);font-size:13px;}

.optimize-results table.trade-table th,.optimize-results table.trade-table td{white-space:nowrap;padding:7px 10px;}

/* ---------------- AI strategy generator ---------------- */
.ai-summary-banner{border-color:var(--brand-dim);background:linear-gradient(160deg,var(--brand-bg),transparent);}
.ai-summary-list{display:flex;flex-wrap:wrap;gap:6px;}
.ai-summary-chip{font-family:var(--font-mono);font-size:11px;background:var(--panel-alt);border:1px solid var(--border);color:var(--text-dim);padding:4px 9px;border-radius:20px;}

/* ---------------- Code export (Pine Script / MQL5) ---------------- */
.lang-tabs{display:flex;gap:6px;}
.lang-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--panel-alt);color:var(--text-faint);border:1px solid var(--border);}
.lang-tab.on{background:var(--brand-bg);color:var(--brand);border-color:var(--brand-dim);}
.code-block-wrap{position:relative;}
.code-block{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:16px;overflow-x:auto;max-height:480px;overflow-y:auto;margin:0;
}
.code-block code{font-family:var(--font-mono);font-size:12px;line-height:1.65;color:#C9D1E0;white-space:pre;}
.code-copy-btn{position:absolute;top:10px;right:10px;background:var(--panel);z-index:2;}

/* ---------------- Ratings ---------------- */
.rating-row{display:flex;align-items:center;gap:8px;margin:2px 0 2px;}
.stars{display:flex;gap:1px;}
.star{width:15px;height:15px;color:var(--text-faint);}
.star svg{width:100%;height:100%;display:block;}
.star.filled{color:var(--brand);}
.star-btn{background:none;border:none;padding:1px;cursor:pointer;}
.star-btn.mine.filled{color:#9384FF;}
.rating-meta{font-size:11px;color:var(--text-faint);font-family:var(--font-mono);}

/* ---------------- Trending widget ---------------- */
.trend-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.trend-row:last-child{border-bottom:none;}
.trend-rank{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);width:20px;flex-shrink:0;}
.trend-info{flex:1;min-width:0;}
.trend-info b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.trend-info span{font-size:11px;color:var(--text-faint);}
.trend-stats{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:11.5px;font-family:var(--font-mono);flex-shrink:0;}
.stars-compact{color:var(--brand);display:flex;align-items:center;gap:3px;}
.stars-compact .ic-wrap svg{width:11px;height:11px;}

/* ---------------- Crowd Pulse (signature feature) ---------------- */
.pulse-row{padding:10px 0;border-bottom:1px solid var(--border-soft);}
.pulse-row:last-child{border-bottom:none;}
.pulse-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.pulse-symbol{font-family:var(--font-mono);font-weight:600;font-size:13px;}
.pulse-lean{font-size:11px;font-weight:700;letter-spacing:.03em;}
.pulse-bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--bg-elevated);}
.pulse-long{background:var(--long);height:100%;}
.pulse-short{background:var(--short);height:100%;}
.pulse-labels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-faint);font-family:var(--font-mono);margin-top:4px;}

/* ---------------- Trader profile ---------------- */
.profile-top{display:flex;align-items:center;gap:14px;}
.avatar-swatches{display:flex;gap:8px;}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0;}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--bg);}
.clickable{cursor:pointer;}
.clickable:hover{opacity:.85;}
.profile-stats{display:flex;gap:28px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);}
.profile-stats div b{display:block;font-family:var(--font-mono);font-size:18px;}
.profile-stats div span{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
textarea.input{resize:vertical;font-family:var(--font-body);}

/* ---------------- Feed / social post card ---------------- */
.post-card{margin-bottom:14px;}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.post-body{padding:12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-sm);}
.post-actions{display:flex;align-items:center;gap:6px;margin-top:12px;}
.post-action-btn{
  display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;color:var(--text-faint);
  font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:6px;
}
.post-action-btn:hover{background:var(--panel-hover);color:var(--text);}
.post-action-btn.on{color:var(--short);}
.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid var(--border-soft);}
.comment-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:12.5px;}
.comment-row b{margin-right:5px;}
.comment-row span{color:var(--text-dim);}
.comment-form{display:flex;gap:8px;margin-top:6px;}
.comment-form input{flex:1;}

/* ---------------- Live positions ---------------- */
.live-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
.live-row:last-child{border-bottom:none;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--long);flex-shrink:0;position:relative;}
.live-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--long);animation:pulseRing 1.8s ease-out infinite;}
@keyframes pulseRing{0%{transform:scale(0.6);opacity:.9;}100%{transform:scale(1.8);opacity:0;}}
.live-row .info{flex:1;min-width:0;}
.live-row .info b{display:block;font-size:13px;}
.live-row .info span{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}
.live-row .pnl-col{text-align:right;}
.live-row .pnl-col b{display:block;font-family:var(--font-mono);font-size:13.5px;}
.live-row .pnl-col span{font-size:11px;font-family:var(--font-mono);}

@media (max-width:920px){
  .auth-side{display:none;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-2{grid-template-columns:1fr;}
  .builder-grid{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:-230px;z-index:50;transition:left .2s;box-shadow:20px 0 40px rgba(0,0,0,0.4);}
  .sidebar.open{left:0;}
  .settings-grid{grid-template-columns:1fr;}
  .hide-desktop{display:inline-flex !important;}
  .content{padding:20px 16px;}
  .topbar{padding:14px 16px;}
  .notif-dropdown{width:min(88vw,320px);right:-8px;}
}
@media (min-width:921px){
  .sidebar-scrim{display:none;}
}

/* ================= ARABIC / RTL SUPPORT ================= */
/* Applying `dir="rtl"` on <html> flips flex-row ordering automatically
   (the sidebar and main content swap sides); the rules below fix the small
   number of physical-direction properties (borders, absolute positions)
   that don't flip on their own. This covers the app's structural shell and
   common components — not an exhaustive mirror of every screen. */
html[lang="ar"] body{font-family:var(--font-arabic),var(--font-body);}
html[lang="ar"] .brand-mark,html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{font-family:var(--font-arabic),var(--font-display);}
html[dir="rtl"] body{direction:rtl;}
html[dir="rtl"] .sidebar{border-right:none;border-left:1px solid var(--border-soft);}
html[dir="rtl"] .auth-side{border-right:none;border-left:1px solid var(--border-soft);}
html[dir="rtl"] .toast-stack{right:auto;left:22px;}
html[dir="rtl"] .notif-dropdown{right:auto;left:0;}
html[dir="rtl"] .modal-foot{flex-direction:row-reverse;}
html[dir="rtl"] .direction-toggle{flex-direction:row-reverse;}
html[dir="rtl"] .field label,html[dir="rtl"] .panel-head,html[dir="rtl"] .nav-label{text-align:right;}
html[dir="rtl"] input,html[dir="rtl"] textarea,html[dir="rtl"] select{text-align:right;}
/* Numbers, tickers, code and monospace data stay LTR even in an RTL UI —
   this matches standard practice on Arabic financial/trading sites. */
html[dir="rtl"] .mono,html[dir="rtl"] code,html[dir="rtl"] pre,html[dir="rtl"] .chart-wrap{direction:ltr;text-align:left;}
html[dir="rtl"] .lang-switch{flex-direction:row-reverse;}
</style>
</head>
<body>

<script>

   VaticTrader — Algorithmic Day-Trading Platform (prototype)
   Single-file vanilla JS SPA. Persistence via window.storage where available,
   falling back to in-memory storage so the demo still works if it is not.
   ========================================================================== */

/* ---------------------------- Safe storage shim --------------------------- */
/* ---------------------------- Safe storage shim --------------------------- */
/* Three-layer fallback so the SAME file works in three different contexts:
   1) A real deployed backend (Express + Postgres) — used automatically when
      the app detects one at /api/*.
   2) A Claude.ai artifact — via window.storage, when no backend is present.
   3) Neither — an in-memory store, so the UI still works for a single session. */
const MemStore = { data: {} };
let authToken = null;
let backendAvailableCache = null; // null = unknown, true/false = determined
try { authToken = localStorage.getItem('vtToken') || null; } catch (e) {}

async function backendAvailable() {
  if (backendAvailableCache !== null) return backendAvailableCache;
  try {
    const res = await fetch('/api/health', { method: 'GET' });
    backendAvailableCache = res.ok;
  } catch (e) {
    backendAvailableCache = false;
  }
  return backendAvailableCache;
}
function authHeaders() {
  return authToken ? { 'Authorization': 'Bearer ' + authToken } : {};
}
function setAuthToken(token) {
  authToken = token;
  try { if (token) localStorage.setItem('vtToken', token); else localStorage.removeItem('vtToken'); } catch (e) {}
}

async function storeGet(key, shared) {
  const k = (shared ? 'shared:' : 'me:') + key;
  if (await backendAvailable()) {
    try {
      const res = await fetch(`/api/kv/${encodeURIComponent(key)}?shared=${!!shared}`, { headers: authHeaders() });
      if (res.status === 404) return null;
      if (res.ok) { const data = await res.json(); return data.value; }
      return null;
    } catch (e) { backendAvailableCache = false; }
  }
  try {
    if (window.storage && window.storage.get) {
      const r = await window.storage.get(key, !!shared);
      return r ? r.value : null;
    }
  } catch (e) { /* key not found or storage unavailable */ }
  return MemStore.data[k] !== undefined ? MemStore.data[k] : null;
}
async function storeSet(key, value, shared) {
  const k = (shared ? 'shared:' : 'me:') + key;
  if (await backendAvailable()) {
    try {
      const res = await fetch(`/api/kv/${encodeURIComponent(key)}?shared=${!!shared}`, {
        method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
        body: JSON.stringify({ value }),
      });
      if (res.ok) return true;
    } catch (e) { backendAvailableCache = false; }
  }
  MemStore.data[k] = value;
  try {
    if (window.storage && window.storage.set) {
      await window.storage.set(key, value, !!shared);
      return true;
    }
  } catch (e) { /* fall through to memory */ }
  return true;
}
async function storeDelete(key, shared) {
  const k = (shared ? 'shared:' : 'me:') + key;
  if (await backendAvailable()) {
    try {
      const res = await fetch(`/api/kv/${encodeURIComponent(key)}?shared=${!!shared}`, { method: 'DELETE', headers: authHeaders() });
      if (res.ok) return;
    } catch (e) { backendAvailableCache = false; }
  }
  delete MemStore.data[k];
  try {
    if (window.storage && window.storage.delete) { await window.storage.delete(key, !!shared); }
  } catch (e) {}
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function fmtMoney(n) { const s = n < 0 ? '-' : ''; return s + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function timeAgo(ts) {
  const d = Date.now() - ts, m = 60000, h = 3600000, day = 86400000;
  if (d < m) return 'just now';
  if (d < h) return Math.floor(d / m) + 'm ago';
  if (d < day) return Math.floor(d / h) + 'h ago';
  return Math.floor(d / day) + 'd ago';
}
// deterministic PRNG seeded from a string, so the same strategy always
// produces the same mock backtest until its parameters actually change
function seededRandom(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

const LEVELS = [
  { level: 1, title: 'Rookie', xp: 0 },
  { level: 2, title: 'Apprentice', xp: 80 },
  { level: 3, title: 'Strategist', xp: 200 },
  { level: 4, title: 'Analyst', xp: 400 },
  { level: 5, title: 'Tactician', xp: 700 },
  { level: 6, title: 'Specialist', xp: 1100 },
  { level: 7, title: 'Expert', xp: 1700 },
  { level: 8, title: 'Veteran', xp: 2500 },
  { level: 9, title: 'Master Trader', xp: 3600 },
  { level: 10, title: 'Market Wizard', xp: 5000 },
];
function levelInfo(xp) {
  xp = xp || 0;
  let current = LEVELS[0], idx = 0;
  for (let i = 0; i < LEVELS.length; i++) { if (xp >= LEVELS[i].xp) { current = LEVELS[i]; idx = i; } else break; }
  const next = LEVELS[idx + 1] || null;
  const progress = next ? Math.max(0, Math.min(100, Math.round(((xp - current.xp) / (next.xp - current.xp)) * 100))) : 100;
  return { level: current.level, title: current.title, xp, next, progress, xpToNext: next ? next.xp - xp : 0 };
}
function awardXP(amount) {
  if (!State.user) return;
  const before = levelInfo(State.user.xp || 0).level;
  State.user.xp = (State.user.xp || 0) + amount;
  saveUser();
  const after = levelInfo(State.user.xp).level;
  if (after > before) {
    const info = levelInfo(State.user.xp);
    toast(`🎉 Level up! You're now Level ${info.level} — ${info.title}`, 'ok');
  }
}

function achievementContext() {
  const published = publishedByUser(State.user.username);
  const totalCopiesReceived = published.reduce((s, e) => s + (e.copies || 0), 0);
  const followers = followersOf(State.user.username).length;
  const following = followingOf(State.user.username).length;
  const publishedTopRated = published.some(e => ratingCountOf(e) >= 5 && avgRatingOf(e) >= 4.5);
  return { published, totalCopiesReceived, followers, following, publishedTopRated };
}
function checkAchievements() {
  if (!State.user || !Array.isArray(State.community) || !Array.isArray(State.follows)) return;
  const ctx = achievementContext();
  const already = new Set(State.user.unlockedAchievements || []);
  const newly = ACHIEVEMENTS.filter(a => !already.has(a.id) && a.check(State.user, ctx));
  if (!newly.length) return;
  State.user.unlockedAchievements = Array.from(already).concat(newly.map(a => a.id));
  newly.forEach(a => { State.user.xp = (State.user.xp || 0) + a.xp; });
  saveUser();
  newly.forEach(a => toast(`🏆 Achievement unlocked: ${a.title} (+${a.xp} XP)`, 'ok'));
}
function updateStreak() {
  if (!State.user) return;
  const today = new Date().toISOString().slice(0, 10);
  if (State.user.lastActiveDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  State.user.streak = State.user.lastActiveDate === yesterday ? (State.user.streak || 0) + 1 : 1;
  State.user.lastActiveDate = today;
  saveUser();
  if (State.user.streak > 1) toast(`🔥 ${State.user.streak}-day streak — keep it going.`, 'ok');
}

/* ================================ PERSISTENCE ================================ */
async function loadSession() {
  if (await backendAvailable()) {
    if (authToken) {
      try {
        const res = await fetch('/api/auth/me', { headers: authHeaders() });
        if (res.ok) {
          const data = await res.json();
          State.session = { username: data.username };
          const raw = await storeGet('user:' + data.username, true);
          if (raw) { State.user = JSON.parse(raw); return; }
        }
        setAuthToken(null);
      } catch (e) { /* connection dropped */ }
    }
    return;
  }
  const s = await storeGet('session', false);
  if (s) {
    try {
      State.session = JSON.parse(s);
      const raw = await storeGet('user:' + State.session.username, true);
      if (raw) { State.user = JSON.parse(raw); }
      else { State.session = null; }
    } catch (e) { State.session = null; }
  }
}
async function saveUser() {
  if (!State.user) return;
  await storeSet('user:' + State.user.username, JSON.stringify(State.user), true);
}
async function saveSession() {
  await storeSet('session', JSON.stringify(State.session), false);
}
function logActivity(type, text) {
  State.user.activity = State.user.activity || [];
  State.user.activity.unshift({ type, text, ts: Date.now() });
  State.user.activity = State.user.activity.slice(0, 12);
}

async function handleSignup(name, email, username, password) {
  username = username.trim().toLowerCase();
  if (!name.trim() || !email.trim() || !username || !password) { State.authError = 'Please fill in every field.'; render(); return; }
  if (!validateEmail(email)) { State.authError = 'Enter a valid email address.'; render(); return; }
  if (password.length < 6) { State.authError = 'Password must be at least 6 characters.'; render(); return; }
  if (!/^[a-z0-9_]{3,20}$/.test(username)) { State.authError = 'Username: 3-20 chars, letters/numbers/underscore only.'; render(); return; }

  let viaBackend = false;
  if (await backendAvailable()) {
    try {
      const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      if (res.status === 409) { State.authError = 'That username is already taken.'; render(); return; }
      if (!res.ok) { State.authError = 'Could not create account — please try again.'; render(); return; }
      const data = await res.json();
      setAuthToken(data.token);
      viaBackend = true;
    } catch (e) { /* connection dropped mid-request — fall through to legacy path */ }
  }
  if (!viaBackend) {
    const existing = await storeGet('user:' + username, true);
    if (existing) { State.authError = 'That username is already taken.'; render(); return; }
  }
  const user = {
    username, name: name.trim(), email: email.trim(), plan: 'Pro',
    trialEndsAt: Date.now() + 30 * 86400000,
    createdAt: Date.now(), brokers: {}, strategies: [], activity: [], lastSeenActivityAt: Date.now(),
    bio: '', avatarColor: AVATAR_PALETTE[Math.floor(seededRandom(username)() * AVATAR_PALETTE.length)],
    xp: 0, streak: 0, lastActiveDate: null, unlockedAchievements: [], waitlistJoined: false,
  };
  if (!viaBackend) user.password = password;
  logActivityFor(user, 'account', 'Account created — welcome to VaticTrader');
  await storeSet('user:' + username, JSON.stringify(user), true);
  State.user = user; State.session = { username };
  if (!viaBackend) await saveSession();
  State.authError = ''; State.view = 'dashboard';
  render(); toast('Account created. Welcome to VaticTrader!', 'ok');
  loadCommunity(); loadFollows(); updateStreak();
}
function logActivityFor(user, type, text) {
  user.activity = user.activity || [];
  user.activity.unshift({ type, text, ts: Date.now() });
}
async function handleLogin(username, password) {
  username = username.trim().toLowerCase();
  if (!username || !password) { State.authError = 'Enter your username and password.'; render(); return; }

  if (await backendAvailable()) {
    try {
      const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      if (res.status === 401) { State.authError = 'Incorrect username or password.'; render(); return; }
      if (res.ok) {
        const data = await res.json();
        setAuthToken(data.token);
        const raw = await storeGet('user:' + username, true);
        if (!raw) { State.authError = 'Account data not found.'; render(); return; }
        const user = JSON.parse(raw);
        State.user = user; State.session = { username };
        State.authError = ''; State.view = 'dashboard';
        render(); toast('Welcome back, ' + user.name.split(' ')[0] + '.', 'ok');
        loadCommunity(); loadFollows(); updateStreak();
        return;
      }
    } catch (e) { /* connection dropped mid-request — fall through */ }
  }
  const raw = await storeGet('user:' + username, true);
  if (!raw) { State.authError = 'No account found with that username.'; render(); return; }
  const user = JSON.parse(raw);
  if (user.password !== password) { State.authError = 'Incorrect password.'; render(); return; }
  State.user = user; State.session = { username }; await saveSession();
  State.authError = ''; State.view = 'dashboard';
  render(); toast('Welcome back, ' + user.name.split(' ')[0] + '.', 'ok');
  loadCommunity(); loadFollows(); updateStreak();
}
async function handleLogout() {
  if (authToken) {
    try { await fetch('/api/auth/logout', { method: 'POST', headers: authHeaders() }); } catch (e) {}
    setAuthToken(null);
  }
  State.session = null; State.user = null;
  await storeDelete('session', false);
  State.view = 'dashboard'; State.authMode = 'login';
  render();
}

function seedRatings(copies, idx) {
  const rnd = seededRandom('ratings-' + idx);
  const n = 3 + Math.floor(rnd() * 9);
  const ratings = {};
  for (let i = 0; i < n; i++) {
    const score = Math.max(1, Math.min(5, Math.round(3.6 + (rnd() - 0.5) * 3)));
    ratings['trader_' + idx + '_' + i] = score;
  }
  return ratings;
}
function avgRatingOf(entry) {
  const vals = Object.values(entry.ratings || {});

}
function ratingCountOf(entry) { return Object.keys(entry.ratings || {}).length; }
function myRatingOf(entry) { return (entry.ratings || {})[State.user.username] || 0; }
function renderRatingStars(entry) {

/* =============================== TRENDING (signature feature #2) ===============
   A single "trend score" blending the ranking signals popularized by Hacker
   News (time-decayed by age), Reddit ("hot"), and Twitter/TikTok-style
   engagement weighting (likes, comments, ratings, adoption) — applied here to
   trading strategies instead of posts, so the strategies rising fastest right
   now surface above ones that are merely old and highly copied. */
function computeTrendScore(entry) {
  const ageHours = Math.max(0, (Date.now() - entry.publishedAt) / 3600000);
  const avg = avgRatingOf(entry), rCount = ratingCountOf(entry);
  const engagement = (entry.copies || 0) * 1 + (entry.likes || []).length * 3 + (entry.comments || []).length * 4 + avg * rCount * 5 + 1;
  return engagement / Math.pow(ageHours + 2, 1.6);
}

/* =============================== CROWD PULSE (signature feature) ================
   Aggregates the direction of every strategy the community has published into a
   live long/short consensus per instrument — a wisdom-of-crowds read that no
   single strategy or backtest can show on its own. Popularity-weighted by copies
   so strategies more traders have adopted count for more. */
function computeCrowdPulse() {
  if (!Array.isArray(State.community)) return null;
  const tally = {};
  State.community.forEach(e => {
    const weight = 1 + Math.log10((e.copies || 0) + 1);
    if (!tally[e.symbol]) tally[e.symbol] = { symbol: e.symbol, long: 0, short: 0, count: 0 };
    const t = tally[e.symbol];
    t.count++;
    if (e.direction === 'long') t.long += weight;
    else if (e.direction === 'short') t.short += weight;
    else { t.long += weight * 0.5; t.short += weight * 0.5; }
  });
  return Object.values(tally)
    .map(t => { const total = t.long + t.short || 1; return { ...t, longPct: Math.round((t.long / total) * 100) }; })
    .sort((a, b) => (b.long + b.short) - (a.long + a.short))
    .slice(0, 6);
}
function renderCrowdPulse() {
  const data = computeCrowdPulse();
  if (data === null) return `<div class="empty-state" style="padding:26px 20px;">${icon('compass')}<p>Loading crowd consensus…</p></div>`;
  if (!data.length) return `<div class="empty-state" style="padding:26px 20px;">${icon('compass')}<p>No community data yet — publish or copy a strategy to seed the pulse.</p></div>`;
  return data.map(d => {
    const shortPct = 100 - d.longPct;
    const lean = d.longPct >= 60 ? 'LONG' : d.longPct <= 40 ? 'SHORT' : 'MIXED';
    const leanColor = lean === 'LONG' ? 'var(--long)' : lean === 'SHORT' ? 'var(--short)' : 'var(--text-faint)';
    return `<div class="pulse-row">
      <div class="pulse-top">
        <span class="pulse-symbol">${esc(d.symbol)}</span>
        <span class="pulse-lean" style="color:${leanColor};">${lean} <span class="faint" style="font-weight:400;">· ${d.count} strat${d.count === 1 ? '' : 's'}</span></span>
      </div>
      <div class="pulse-bar"><div class="pulse-long" style="width:${d.longPct}%;"></div><div class="pulse-short" style="width:${shortPct}%;"></div></div>
      <div class="pulse-labels"><span>${d.longPct}% long</span><span>${shortPct}% short</span></div>
    </div>`;
  }).join('');
}

/* =============================== CODE EXPORT (Pine Script / MQL5) ===============
   Translates a strategy's rule chain into runnable-looking starter code for
   TradingView (Pine Script v5) and MetaTrader 5 (MQL5), respecting each
   condition's AND/OR logic. This is a starting point for a developer to
   refine — not a substitute for testing in the target platform. */
function generatePineScript(s) {
  const dirLong = s.direction === 'long' || s.direction === 'both';
  const dirShort = s.direction === 'short' || s.direction === 'both';
  const decls = [];
  const exprParts = [];
  s.entryConditions.forEach((c, i) => {
    const v = c.value;
    let decl = '', expr = '';
    switch (c.indicator) {
      case 'rsi':
        decl = `rsi${i} = ta.rsi(close, 14)`;
        expr = c.operator === 'is below' ? `rsi${i} < ${v || 30}` : `rsi${i} > ${v || 70}`;
        break;
      case 'macd':
        decl = `[macdLine${i}, signalLine${i}, _hist${i}] = ta.macd(close, 12, 26, 9)`;
        expr = c.operator === 'crosses above signal' ? `ta.crossover(macdLine${i}, signalLine${i})` : `ta.crossunder(macdLine${i}, signalLine${i})`;
        break;
      case 'sma_cross': {
        const parts = (v || '9/21').split('/');
        decl = `fastSMA${i} = ta.sma(close, ${parts[0] || 9})\nslowSMA${i} = ta.sma(close, ${parts[1] || 21})`;
        expr = c.operator.indexOf('above') > -1 ? `ta.crossover(fastSMA${i}, slowSMA${i})` : `ta.crossunder(fastSMA${i}, slowSMA${i})`;
        break;
      }
      case 'ema_cross': {
        const parts = (v || '12/26').split('/');
        decl = `fastEMA${i} = ta.ema(close, ${parts[0] || 12})\nslowEMA${i} = ta.ema(close, ${parts[1] || 26})`;
        expr = c.operator.indexOf('above') > -1 ? `ta.crossover(fastEMA${i}, slowEMA${i})` : `ta.crossunder(fastEMA${i}, slowEMA${i})`;
        break;
      }
      case 'bbands':
        decl = `[bbMid${i}, bbUpper${i}, bbLower${i}] = ta.bb(close, 20, 2)`;
        expr = c.operator.indexOf('upper') > -1 ? `close > bbUpper${i}` : `close < bbLower${i}`;
        break;
      case 'breakout': {
        const n = v || 20;
        decl = `hh${i} = ta.highest(high, ${n})[1]\nll${i} = ta.lowest(low, ${n})[1]`;
        expr = c.operator.indexOf('above') > -1 ? `close > hh${i}` : `close < ll${i}`;
        break;
      }
      case 'volume': {
        const pct = (1 + (parseFloat(v || '150') / 100)).toFixed(2);
        decl = `volAvg${i} = ta.sma(volume, 20)`;
        expr = `volume > volAvg${i} * ${pct}`;
        break;
      }
      case 'vwap':
        decl = `vwapVal${i} = ta.vwap`;
        expr = c.operator.indexOf('above') > -1 ? `ta.crossover(close, vwapVal${i})` : `ta.crossunder(close, vwapVal${i})`;
        break;
      default:
        expr = 'true';
    }
    if (decl) decls.push(decl);
    exprParts.push({ expr, logic: c.logic || 'AND' });
  });
  const condStr = exprParts.map((p, i) => i === 0 ? p.expr : ` ${p.logic.toLowerCase()} ${p.expr}`).join('');

  const lines = [];
  lines.push('//@version=5');
  lines.push(`strategy("${s.name.replace(/"/g, "'")}", overlay=true, initial_capital=10000, default_qty_type=strategy.percent_of_equity, default_qty_value=${s.positionSizePct})`);
  lines.push('');
  lines.push('// --- Indicators ---');
  decls.forEach(d => lines.push(d));
  lines.push('');
  lines.push('// --- Entry condition (chain respects each rule\'s AND / OR) ---');
  lines.push(`entrySignal = ${condStr}`);
  lines.push('');
  lines.push('// --- Entries & exits ---');
  if (dirLong) {
    lines.push('if entrySignal');
    lines.push('    strategy.entry("Long", strategy.long)');
    lines.push(`    strategy.exit("TP/SL Long", from_entry="Long", limit=close * ${(1 + s.takeProfit / 100).toFixed(4)}, stop=close * ${(1 - s.stopLoss / 100).toFixed(4)})`);
  }
  if (dirShort) {
    lines.push(dirLong ? 'if entrySignal' : 'if entrySignal');
    lines.push('    strategy.entry("Short", strategy.short)');
    lines.push(`    strategy.exit("TP/SL Short", from_entry="Short", limit=close * ${(1 - s.takeProfit / 100).toFixed(4)}, stop=close * ${(1 + s.stopLoss / 100).toFixed(4)})`);
  }
  if (s.trailingStop) {
    lines.push('');
    lines.push('// Trailing stop once in profit (approximate — refine trail distance for your instrument)');

/* =============================== AI STRATEGY REVIEWER (rule-based) ==============

  if (bt.winRate < 40) insights.push({ type: 'warning', text: `Win rate is low at ${bt.winRate}% — this strategy leans on its 1:${rr.toFixed(2)} reward/risk ratio to stay profitable rather than on hit rate.` });
  else if (bt.winRate > 55) insights.push({ type: 'good', text: `Win rate of ${bt.winRate}% is solid for a rules-based entry.` });
  if (bt.maxDrawdown > 25) insights.push({ type: 'warning', text: `Max drawdown of ${bt.maxDrawdown}% is significant — a tighter stop loss or smaller position size would reduce this.` });
  if (bt.maxDrawdownDuration > bt.trades * 0.3) insights.push({ type: 'warning', text: `The simulated drawdown lasted ${bt.maxDrawdownDuration} trades in a row without a new equity high — check that's psychologically tolerable before sizing up.` });

/* =============================== MONTE CARLO ROBUSTNESS TEST ====================
   Bootstrap-resamples the simulated trade sequence to show a distribution of
   plausible outcomes, rather than treating one backtest run as gospel. */
function runMonteCarlo(bt, iterations) {
  iterations = iterations || 300;

  if (!pnls.length) return null;
  const rnd = seededRandom('mc-' + bt.generatedAt + '-' + pnls.length);
  const finals = [];
  const drawdowns = [];
  for (let iter = 0; iter < iterations; iter++) {
    let equity = 10000, peak = 10000, maxDD = 0;
    for (let i = 0; i < pnls.length; i++) {
      const idx = Math.floor(rnd() * pnls.length);
      equity = equity * (1 + pnls[idx] / 100);
      peak = Math.max(peak, equity);
      maxDD = Math.max(maxDD, (peak - equity) / peak);
    }
    finals.push(equity);
    drawdowns.push(maxDD * 100);
  }
  finals.sort((a, b) => a - b);
  drawdowns.sort((a, b) => a - b);
  const pct = (arr, p) => arr[Math.min(arr.length - 1, Math.floor(arr.length * p))];
  return {
    iterations,
    p5: Math.round(pct(finals, 0.05)), p25: Math.round(pct(finals, 0.25)), p50: Math.round(pct(finals, 0.50)), p75: Math.round(pct(finals, 0.75)), p95: Math.round(pct(finals, 0.95)),
    ddP50: Math.round(pct(drawdowns, 0.50) * 10) / 10, ddP95: Math.round(pct(drawdowns, 0.95) * 10) / 10,
    profitableShare: Math.round(finals.filter(f => f > 10000).length / finals.length * 1000) / 10,
  };

/* =============================== STRATEGY OPTIMIZER ==============================
   Grid-searches take-profit, stop-loss, position size and this strategy's first
   condition threshold for the combination that scores best on a chosen objective,
   evaluated against the same deterministic mock backtest model. This is a real
   search over the model's parameter space — it is NOT market data optimization,
   and a parameter set that wins here can still be overfit to this one simulation,
   which is why results point back to Monte Carlo for a robustness check. */

  // simulated total return over 100+ compounding trades, differences are just
  // compounding-math artifacts, not a meaningfully "better" parameter set. A small

  const tpCandidates = candidatesAround(strat.takeProfit || 1.5, [0.7, 1, 1.4, 2], 0.3, 6);

/* =============================== BACKTEST ENGINE (mock) ========================= */

/* =============================== CANVAS CHARTS ================================ */
function drawLineChart(canvas, data, opts) {
  opts = opts || {};
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!data || data.length < 2) return;
  const min = Math.min(...data), max = Math.max(...data);
  const pad = (max - min) * 0.1 || 1;
  const lo = min - pad, hi = max + pad;
  const stepX = w / (data.length - 1);
  const up = data[data.length - 1] >= data[0];
  const color = opts.color || (up ? '#35C98C' : '#FF6259');
  // grid
  if (opts.grid) {
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) { const y = (h / 4) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  }
  const pts = data.map((v, i) => [i * stepX, h - ((v - lo) / (hi - lo)) * h]);
  // gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '33'); grad.addColorStop(1, color + '00');
  ctx.beginPath(); ctx.moveTo(pts[0][0], h);
  pts.forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.lineTo(pts[pts.length - 1][0], h); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // line
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.strokeStyle = color; ctx.lineWidth = opts.lineWidth || 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
  if (opts.dot) {
    const last = pts[pts.length - 1];
    ctx.beginPath(); ctx.arc(last[0], last[1], 3.5, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
    ctx.beginPath(); ctx.arc(last[0], last[1], 6, 0, Math.PI * 2);
    ctx.strokeStyle = color + '55'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}
function renderAllCharts() {
  document.querySelectorAll('canvas[data-chart]').forEach(cv => {
    try {
      const points = JSON.parse(cv.getAttribute('data-points') || '[]');
      const grid = cv.getAttribute('data-grid') === '1';
      const dot = cv.getAttribute('data-dot') === '1';
      drawLineChart(cv, points, { grid, dot });
    } catch (e) {}
  });
}

/* ------------------------------ LIVE POSITIONS (simulated) ---------------------- */
function initLiveSim(activeStrategies) {
  activeStrategies.forEach(s => {
    if (State.liveSim[s.id]) return;
    const rnd = seededRandom(s.id + ':' + Math.floor(Date.now() / 60000)); // reseeds roughly every minute if re-created
    const isOpen = rnd() < 0.6;
    if (!isOpen) { State.liveSim[s.id] = { open: false }; return; }
    const side = s.direction === 'both' ? (rnd() < 0.5 ? 'long' : 'short') : (s.direction === 'short' ? 'short' : 'long');
    const base = symbolBasePrice(s.symbol);
    const entryPrice = base * (1 + (rnd() - 0.5) * 0.01);
    State.liveSim[s.id] = { open: true, side, entryPrice, currentPrice: entryPrice, symbol: s.symbol, qty: (s.positionSizePct || 2) };
  });
  // clean up entries for strategies no longer active
  Object.keys(State.liveSim).forEach(id => { if (!activeStrategies.find(s => s.id === id)) delete State.liveSim[id]; });
}
function renderLivePositions() {
  const open = Object.entries(State.liveSim).filter(([, p]) => p.open);
  if (!open.length) return `<div class="empty-state" style="padding:30px 20px;">${icon('pulse')}<p>No open positions right now. This refreshes as your active strategies find setups.</p></div>`;
  return open.map(([id, p]) => {
    const strat = State.user.strategies.find(s => s.id === id);
    const dec = priceDecimals(p.symbol);
    const pnlPct = ((p.currentPrice - p.entryPrice) / p.entryPrice) * (p.side === 'short' ? -100 : 100);
    const pnlAmt = 10000 * (p.qty / 100) * (pnlPct / 100);
    return `<div class="live-row" data-live-row="${id}">
      <div class="live-dot" style="background:${pnlPct >= 0 ? 'var(--long)' : 'var(--short)'};"></div>
      <div class="info"><b>${esc(strat ? strat.name : p.symbol)}</b><span>${p.symbol} · ${p.side.toUpperCase()} @ ${p.entryPrice.toFixed(dec)}</span></div>
      <div class="pnl-col">
        <b data-live-field="price">${p.currentPrice.toFixed(dec)}</b>
        <span data-live-field="pnl" style="color:${pnlAmt >= 0 ? 'var(--long)' : 'var(--short)'};">${fmtMoney(pnlAmt)} (${fmtPct(pnlPct)})</span>
      </div>
    </div>`;
  }).join('');
}
function tickLivePositions() {
  if (State.view !== 'dashboard' || !State.session) return;
  const container = document.getElementById('live-positions-panel');
  if (!container) return;
  let changed = false;
  Object.entries(State.liveSim).forEach(([id, p]) => {
    if (!p.open) return;
    const drift = (Math.random() - 0.5) * p.currentPrice * 0.0025;
    p.currentPrice = Math.max(0.0001, p.currentPrice + drift);
    changed = true;
    const row = container.querySelector(`[data-live-row="${id}"]`);
    if (!row) return;
    const dec = priceDecimals(p.symbol);
    const pnlPct = ((p.currentPrice - p.entryPrice) / p.entryPrice) * (p.side === 'short' ? -100 : 100);
    const pnlAmt = 10000 * (p.qty / 100) * (pnlPct / 100);
    const priceEl = row.querySelector('[data-live-field="price"]');
    const pnlEl = row.querySelector('[data-live-field="pnl"]');
    const dotEl = row.querySelector('.live-dot');
    if (priceEl) priceEl.textContent = p.currentPrice.toFixed(dec);
    if (pnlEl) { pnlEl.textContent = `${fmtMoney(pnlAmt)} (${fmtPct(pnlPct)})`; pnlEl.style.color = pnlAmt >= 0 ? 'var(--long)' : 'var(--short)'; }
    if (dotEl) dotEl.style.background = pnlPct >= 0 ? 'var(--long)' : 'var(--short)';
  });
}

function getFilteredSortedStrategies() {
  const all = State.user.strategies || [];
  let strategies = all.filter(s => {

    const matchesQ = !q || s.name.toLowerCase().includes(q) || s.symbol.toLowerCase().includes(q);
    const matchesStatus = State.stratStatus === 'all' || s.status === State.stratStatus;
    return matchesQ && matchesStatus;
  });
  if (State.stratSort === 'return') strategies = strategies.slice().sort((a, b) => (b.backtest ? b.backtest.totalReturn : -999) - (a.backtest ? a.backtest.totalReturn : -999));

  else strategies = strategies.slice().sort((a, b) => b.createdAt - a.createdAt);
  return strategies;
}

  return `<div class="panel panel-pad" style="margin-bottom:16px;">
    <div class="panel-head"><h3>${icon('compass')} Robustness testing</h3>${!cached ? `<button type="button" class="btn btn-outline btn-sm" data-action="run-montecarlo" data-id="${s.id}">${icon('chart')} Run Monte Carlo (300 runs)</button>` : `<button type="button" class="btn btn-ghost btn-sm" data-action="run-montecarlo" data-id="${s.id}">${icon('chart')} Re-run</button>`}</div>
    ${cached ? renderMonteCarloResult(cached) : `<div class="empty-state" style="padding:24px 20px;">${icon('compass')}<p>Reshuffles this strategy's simulated trades hundreds of times to show a range of plausible outcomes, instead of trusting one backtest run.</p></div>`}
    ${consistency ? `

function symbolDailyChange(sym) {
  const day = Math.floor(Date.now() / 86400000);
  const rnd = seededRandom(sym + ':' + day);
  return (rnd() - 0.45) * 4;
}
function crowdLeanFor(symbol) {
  if (!Array.isArray(State.community)) return null;
  let long = 0, short = 0, count = 0;
  State.community.forEach(e => {
    if (e.symbol !== symbol) return;
    count++;
    const w = 1 + Math.log10((e.copies || 0) + 1);
    if (e.direction === 'long') long += w;
    else if (e.direction === 'short') short += w;
    else { long += w * 0.5; short += w * 0.5; }
  });
  if (!count) return { count: 0, longPct: 50 };
  const total = long + short || 1;
  return { count, longPct: Math.round((long / total) * 100) };
}

const EXAMPLE_MQL5 = `//+------------------------------------------------------------------+
//|  Golden Cross Trend Follower — MQL5 Expert Advisor                |
//+------------------------------------------------------------------+
#property strict
#include <Trade/Trade.mqh>
CTrade trade;

input double TakeProfitPct = 6.0;
input double StopLossPct   = 3.0;
input double RiskPercent   = 2.0;

int fastMAHandle, slowMAHandle, rsiHandle;

int OnInit()
{
   fastMAHandle = iMA(_Symbol, PERIOD_CURRENT, 50, 0, MODE_SMA, PRICE_CLOSE);
   slowMAHandle = iMA(_Symbol, PERIOD_CURRENT, 200, 0, MODE_SMA, PRICE_CLOSE);
   rsiHandle    = iRSI(_Symbol, PERIOD_CURRENT, 14, PRICE_CLOSE);
   return(INIT_SUCCEEDED);
}

void OnTick()
{
   double fastMA[], slowMA[], rsiBuf[];
   CopyBuffer(fastMAHandle, 0, 0, 2, fastMA);
   CopyBuffer(slowMAHandle, 0, 0, 2, slowMA);
   CopyBuffer(rsiHandle, 0, 0, 1, rsiBuf);

   bool goldenCross = (fastMA[1] <= slowMA[1] && fastMA[0] > slowMA[0]);
   bool entrySignal = goldenCross && rsiBuf[0] < 70;

   if(entrySignal && PositionsTotal() == 0)
   {
      double price = SymbolInfoDouble(_Symbol, SYMBOL_BID);
      double sl = price * (1 - StopLossPct / 100);
      double tp = price * (1 + TakeProfitPct / 100);
      double lot = 0.1; // TODO: size from RiskPercent and AccountBalance()
      trade.Buy(lot, _Symbol, price, sl, tp, "Golden Cross");
   }

   // Exit early on a death cross
   bool deathCross = (fastMA[1] >= slowMA[1] && fastMA[0] < slowMA[0]);
   if(deathCross && PositionsTotal() > 0)
      trade.PositionClose(_Symbol);
}`;

function renderConditionNode(c, i, total) {
  const ind = indicatorById(c.indicator);
  const logic = c.logic || 'AND';
  const connector = i > 0 ? `<div class="chain-connector"><div class="line"></div><select class="logic-select ${logic === 'OR' ? 'is-or' : ''}" data-field="cond-logic" data-id="${c.id}"><option value="AND" ${logic === 'AND' ? 'selected' : ''}>AND</option><option value="OR" ${logic === 'OR' ? 'selected' : ''}>OR</option></select></div>` : '';
  return `${connector}
  <div class="chain-node" data-cond-id="${c.id}">
    <div class="node-badge">${i + 1}</div>
    <div class="node-fields">
      <select data-field="cond-indicator" data-id="${c.id}">${INDICATORS.map(x => `<option value="${x.id}" ${x.id === c.indicator ? 'selected' : ''}>${x.label}</option>`).join('')}</select>
      <select data-field="cond-operator" data-id="${c.id}">${ind.ops.map(op => `<option ${op === c.operator ? 'selected' : ''}>${op}</option>`).join('')}</select>
      ${ind.novalue ? `<input class="input" value="—" disabled>` : `<input class="input" data-field="cond-value" data-id="${c.id}" value="${esc(c.value)}" placeholder="${ind.placeholder}">`}
    </div>
    ${total > 1 ? `<button class="node-remove" data-action="remove-condition" data-id="${c.id}">${icon('x')}</button>` : ''}
  </div>`;
}
